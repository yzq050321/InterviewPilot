name: CI

# 触发条件：推到 main、或对 main 发 PR 时自动运行。
# 也可以手动触发（Actions 页面上的 "Run workflow"，需要加 workflow_dispatch）。
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 最小权限：只读仓库内容，不写回任何东西。
permissions:
  contents: read

jobs:
  # ─────────────────────────────────────────────
  # 任务一：后端测试
  # ─────────────────────────────────────────────
  backend:
    name: 后端测试 (pytest)
    runs-on: ubuntu-latest

    # 后续所有 run 步骤都默认在 backend/ 目录下执行
    defaults:
      run:
        working-directory: backend

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          # 固定版本，避免 ubuntu-latest 镜像升级导致 CI 随机变红
          python-version: "3.12"
          # 缓存 pip 下载的 wheel，第二次跑会快很多
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 关键一步：这里没有任何 .env，测试必须靠 conftest.py 自举。
      # 如果这一步红了，说明"别人 clone 下来跑不起来"。
      - name: 运行测试
        run: python -m pytest -q

  # ─────────────────────────────────────────────
  # 任务二：前端构建
  # ─────────────────────────────────────────────
  frontend:
    name: 前端构建 (vite)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # npm ci 严格按 package-lock.json 安装，可复现；
      # 不要用 npm install，它会悄悄改动锁文件。
      - name: 安装依赖
        run: npm ci

      # tsc -b && vite build：类型检查 + 打包，两者任一失败即失败
      - name: 构建
        run: npm run build

  # ─────────────────────────────────────────────
  # 任务三：镜像构建 + 全栈冒烟测试
  #
  # 与上面两个任务的区别：上面证明「代码逻辑对」，
  # 这里证明「别人拿到仓库能真的把它跑起来」。
  # ─────────────────────────────────────────────
  docker:
    name: 镜像构建与全栈冒烟
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      # 后端在 import 阶段就读取 DEEPSEEK_API_KEY，缺了容器会直接退出。
      # CI 里用 .env.example 的占位值即可，不会发起真实调用。
      - name: 准备环境变量
        run: cp backend/.env.example backend/.env

      # --wait 会等到所有服务 healthy 或 running 才返回；
      # --wait-timeout 给足首次拉取 mysql 镜像 + 构建前端的时间。
      - name: 构建并启动全栈
        run: docker compose up -d --build --wait --wait-timeout 300

      - name: 确认服务状态
        run: docker compose ps

      # 两个入口都打一次：
      #   8080 -> Nginx 反代 -> api:8000
      #   8000 -> 直连后端
      - name: 健康检查
        run: |
          # --wait 现在会等到 api 与 web 的健康检查都通过，
          # 这里再加重试兜底，避免健康状态切换瞬间的抖动。
          echo "--- 经 Nginx 反代 ---"
          curl -fsS --retry 20 --retry-delay 2 --retry-all-errors http://127.0.0.1:8080/api/health
          echo
          echo "--- 直连后端 ---"
          curl -fsS --retry 20 --retry-delay 2 --retry-all-errors http://127.0.0.1:8000/api/health

      # 失败时把容器日志打出来，否则 Actions 页面只能看到 exit code 1
      - name: 失败时输出容器日志
        if: failure()
        run: docker compose logs --tail 60

      - name: 清理
        if: always()
        run: docker compose down -v
