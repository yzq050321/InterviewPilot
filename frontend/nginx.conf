server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # React Router：刷新 /admin/login 这类前端路由时，
    # 磁盘上没有对应文件，要交回 index.html 让前端路由接管，
    # 否则会 404。
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API 反向代理。
    # 注意 proxy_pass 后面写的是 api —— 这是 compose 的服务名，
    # Docker 内置 DNS 会把它解析成该容器的 IP。
    # 这里绝不能写 127.0.0.1，那会指向 nginx 容器自己。
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
